<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin · Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>

<!-- LOGIN -->
<main id="login" class="login" hidden>
  <form id="loginForm" class="login-card" autocomplete="off">
    <p class="eyebrow">Admin dashboard</p>
    <h1>Welcome <em>back.</em></h1>
    <p class="muted">Sign in to edit your portfolio. Changes appear on the public site instantly.</p>
    <label class="field">
      <span class="label">Password</span>
      <input id="password" type="password" required autofocus autocomplete="current-password">
    </label>
    <p id="loginError" class="form-error" role="alert" hidden></p>
    <button class="btn btn-primary" type="submit">Sign in →</button>
    <a class="back-link" href="/">← Back to portfolio</a>
  </form>
</main>

<!-- APP -->
<div id="app" hidden>
  <header class="topbar">
    <a class="logo" href="#overview">Port<span>·</span>folio <small>admin</small></a>
    <div class="topbar-actions">
      <a class="btn btn-outline" href="/" target="_blank" rel="noopener">View site ↗</a>
      <button id="logoutBtn" class="btn btn-ghost" type="button">Log out</button>
    </div>
  </header>

  <div class="layout">
    <nav id="tabs" class="tabs" aria-label="Sections"></nav>
    <main id="main" class="main"></main>
  </div>
</div>

<!-- ADD / EDIT DIALOG -->
<dialog id="formDialog">
  <form id="itemForm" method="dialog" novalidate>
    <header class="dialog-head">
      <h2 id="formTitle"></h2>
      <button type="button" class="icon-btn" id="formClose" aria-label="Close">✕</button>
    </header>
    <div id="formFields" class="dialog-body"></div>
    <p id="formError" class="form-error" role="alert" hidden></p>
    <footer class="dialog-foot">
      <button type="button" class="btn btn-outline" id="formCancel">Cancel</button>
      <button type="submit" class="btn btn-primary" id="formSubmit">Save</button>
    </footer>
  </form>
</dialog>

<!-- CONFIRM DIALOG -->
<dialog id="confirmDialog" class="small">
  <form method="dialog">
    <div class="dialog-body">
      <h2 id="confirmTitle">Are you sure?</h2>
      <p id="confirmText" class="muted"></p>
    </div>
    <footer class="dialog-foot">
      <button value="cancel" class="btn btn-outline">Cancel</button>
      <button value="ok" id="confirmOk" class="btn btn-danger">Confirm</button>
    </footer>
  </form>
</dialog>

<div id="toasts" class="toasts" aria-live="polite"></div>

<script src="/admin/admin.js"></script>
</body>
</html>
